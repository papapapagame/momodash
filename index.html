<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>ももダッシュ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <canvas id="game-canvas" width="960" height="540" aria-label="ももダッシュ"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-score">
        <span class="hud-label">スコア</span>
        <span id="score-value">0</span>
      </div>
      <div id="feather-hud" class="feather-hud hidden" title="3段ジャンプストック">
        <span class="feather-icon" aria-hidden="true"></span>
        <span class="feather-label">3段ジャンプ</span>
      </div>
      <div class="hud-right">
        <div class="hud-speed">
          <span class="hud-label">スピード</span>
          <span id="speed-value">100%</span>
        </div>
        <div class="hud-best">
          <span class="hud-label">ベスト</span>
          <span id="best-value">0</span>
        </div>
      </div>
    </div>

    <div id="title-screen" class="overlay">
      <div class="panel title-panel">
        <p class="brand">ももダッシュ</p>
        <p class="tagline">
          タップでジャンプ！さらにタップで2段ジャンプ！<br>
          羽を取ると1回だけ3段ジャンプができるよ！<br>
          2段（3段）ジャンプ後さらにタップで急降下！
        </p>
        <p class="title-best">ハイスコア <span id="title-best-value">0</span></p>
        <div class="sound-settings">
          <label class="bgm-select-wrap">
            <span class="sound-field-label">BGM</span>
            <select id="bgm-mode" class="bgm-select" aria-label="BGM選択">
              <option value="0">ももももラン！</option>
              <option value="1">Peach Mode</option>
              <option value="2">Peach Dash</option>
              <option value="sequence">3曲連続</option>
              <option value="random">ランダム（1曲ループ）</option>
              <option value="off">BGMなし</option>
            </select>
          </label>
          <label class="sound-toggle">
            <span class="sound-toggle-label">効果音</span>
            <input id="toggle-sfx" type="checkbox" checked>
            <span class="switch" aria-hidden="true"></span>
          </label>
        </div>
        <button id="btn-start" class="btn primary" type="button">スタート</button>
        <p class="hint">スペース / クリック / タップ</p>
      </div>
    </div>

    <button id="btn-debug-title" class="debug-exit-btn hidden" type="button">タイトルへ</button>
    <div id="debug-badge" class="debug-badge hidden">DEBUG</div>

    <div id="gameover-screen" class="overlay hidden">
      <div class="panel gameover-panel">
        <p class="result-title">ゲームオーバー</p>
        <p class="result-score">スコア <span id="final-score">0</span></p>
        <p id="new-best" class="new-best hidden">ベスト更新！</p>
        <button id="btn-retry" class="btn primary" type="button">もういちど</button>
        <button id="btn-title" class="btn secondary" type="button">タイトルへ</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
