<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>ももダッシュ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <canvas id="game-canvas" width="960" height="540" aria-label="ももダッシュ"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-score">
        <span class="hud-label">スコア</span>
        <span id="score-value">0</span>
      </div>
      <div id="feather-hud" class="feather-hud hidden" title="3段ジャンプストック">
        <span class="feather-icon" aria-hidden="true"></span>
        <span class="feather-label">3段ジャンプ</span>
      </div>
      <div class="hud-right">
        <div class="hud-speed">
          <span class="hud-label">スピード</span>
          <span id="speed-value">100%</span>
        </div>
        <div class="hud-best">
          <span class="hud-label">ベスト</span>
          <span id="best-value">0</span>
        </div>
      </div>
    </div>

    <div id="title-screen" class="overlay">
      <div class="panel title-panel">
        <p class="brand">ももダッシュ</p>
        <div class="user-row" id="user-row">
          <p class="user-name-line">
            <span class="user-name-label">プレイヤー</span>
            <span id="title-user-name">未登録</span>
          </p>
          <button id="btn-delete-user" class="btn-delete-user hidden" type="button">ユーザー名削除</button>
        </div>
        <p class="tagline">
          キャラと難易度を選んでスタート！<br>
          タップでジャンプ（キャラによって能力が違うよ）
        </p>
        <div class="mode-records" id="mode-records">
          <div class="mode-record">
            <span class="mode-record-label">EASY</span>
            <span class="mode-record-score" id="record-easy-score">0</span>
            <span class="record-char char-swatch" id="record-easy-char" aria-hidden="true"></span>
          </div>
          <div class="mode-record">
            <span class="mode-record-label">NORMAL</span>
            <span class="mode-record-score" id="record-normal-score">0</span>
            <span class="record-char char-swatch" id="record-normal-char" aria-hidden="true"></span>
          </div>
          <div class="mode-record">
            <span class="mode-record-label">HARD</span>
            <span class="mode-record-score" id="record-hard-score">0</span>
            <span class="record-char char-swatch" id="record-hard-char" aria-hidden="true"></span>
          </div>
        </div>
        <div class="mode-select">
          <span class="sound-field-label">難易度</span>
          <div class="mode-grid" role="listbox" aria-label="難易度選択">
            <button type="button" class="mode-btn" data-mode="easy" aria-pressed="false">EASY</button>
            <button type="button" class="mode-btn" data-mode="normal" aria-pressed="true">NORMAL</button>
            <button type="button" class="mode-btn" data-mode="hard" aria-pressed="false">HARD</button>
          </div>
        </div>
        <div class="char-select">
          <span class="sound-field-label">キャラ選択</span>
          <div class="char-grid" role="listbox" aria-label="キャラクター選択">
            <button type="button" class="char-btn" data-char="normal" data-slot="secret" id="char-btn-secret" aria-pressed="true">
              <span class="char-swatch char-swatch-normal" id="char-slot-swatch" aria-hidden="true"></span>
              <span class="char-name" id="char-slot-name">ノーマル桃</span>
            </button>
            <button type="button" class="char-btn" data-char="spin" aria-pressed="false">
              <span class="char-swatch char-swatch-spin" aria-hidden="true"></span>
              <span class="char-name">スピン桃</span>
            </button>
            <button type="button" class="char-btn" data-char="heavy" aria-pressed="false">
              <span class="char-swatch char-swatch-heavy" aria-hidden="true"></span>
              <span class="char-name">ヘビー桃</span>
            </button>
            <button type="button" class="char-btn" data-char="wing" aria-pressed="false">
              <span class="char-swatch char-swatch-wing" aria-hidden="true"></span>
              <span class="char-name">ウイング桃</span>
            </button>
          </div>
          <p id="char-desc" class="char-desc"></p>
          <div id="char-records" class="char-records">
            <span>EASY <b id="char-best-easy">0</b></span>
            <span>NORMAL <b id="char-best-normal">0</b></span>
            <span>HARD <b id="char-best-hard">0</b></span>
          </div>
        </div>
        <div class="sound-settings">
          <label class="bgm-select-wrap">
            <span class="sound-field-label">BGM</span>
            <select id="bgm-mode" class="bgm-select" aria-label="BGM選択">
              <option value="0">ももももラン！</option>
              <option value="1">Peach Mode</option>
              <option value="2">Peach Dash</option>
              <option value="sequence">3曲連続</option>
              <option value="random">ランダム（1曲ループ）</option>
              <option value="off">BGMなし</option>
            </select>
          </label>
          <label class="sound-toggle">
            <span class="sound-toggle-label">効果音</span>
            <input id="toggle-sfx" type="checkbox" checked>
            <span class="switch" aria-hidden="true"></span>
          </label>
          <label class="sound-toggle fireworks-toggle">
            <span class="sound-toggle-label">花火</span>
            <input id="toggle-fireworks" type="checkbox" checked>
            <span class="switch" aria-hidden="true"></span>
          </label>
        </div>
        <button id="btn-start" class="btn primary" type="button">スタート</button>
        <p class="hint">スペース / クリック / タップ</p>
        <p class="version" id="app-version">Ver.1.04</p>
      </div>
    </div>

    <div id="name-register-screen" class="overlay hidden">
      <div class="panel name-register-panel">
        <p class="result-title">ユーザー名登録</p>
        <p class="name-register-desc">ゲームで使う名前を入力してね</p>
        <input id="input-user-name" class="name-input" type="text" maxlength="12" placeholder="なまえ" autocomplete="nickname" enterkeyhint="done">
        <p id="name-register-error" class="name-register-error hidden">名前を入力してください</p>
        <button id="btn-name-ok" class="btn primary" type="button">決定してはじめる</button>
        <button id="btn-name-cancel" class="btn secondary" type="button">もどる</button>
      </div>
    </div>

    <button id="btn-debug-title" class="debug-exit-btn hidden" type="button">タイトルへ</button>
    <div id="debug-badge" class="debug-badge hidden">DEBUG</div>

    <div id="gameover-screen" class="overlay hidden">
      <div class="panel gameover-panel">
        <p class="result-title">ゲームオーバー</p>
        <p class="result-score"><span id="final-score-label">スコア</span> <span id="final-score">0</span></p>
        <p id="new-best" class="new-best hidden">ベスト更新！</p>
        <div class="gameover-actions">
          <button id="btn-retry" class="btn primary" type="button">もういちど</button>
          <button id="btn-title" class="btn secondary" type="button">タイトルへ</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
